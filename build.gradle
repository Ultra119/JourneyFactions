plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

// Modern Gradle syntax - no more deprecation warnings
base {
    archivesName = "${project.name}-mc${project.minecraft_version}"
}
version = project.mod_version
group = project.maven_group

repositories {
    // JourneyMap API repositories
    maven {
        name = "JourneyMap (Public)"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    maven {
        name = "New JourneyMap Maven"
        url = 'https://maven.blamejared.com'
    }
    // Add Modrinth Maven for JourneyMap and Factions
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // Cloth Config repository
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

configurations.all {
    // Check for snapshots more frequently than Gradle's default of 1 day
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

loom {
    // Disabled split sourcesets - JourneyMap API is client-only and needs to be
    // accessible across the codebase. All code is now in main sourceset.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JourneyMap API 26.3
    modImplementation files("C:/Users/pasas/Desktop/minecraft/mods_src/libs/journeymap-api-fabric-26.3-2.0.0.jar")

    // Cloth config 26.3
    modCompileOnly files("C:/Users/pasas/Desktop/minecraft/server2026/mods/cloth-config-fabric-26.3.159.jar")

    // Factions mod 26.3
    modCompileOnly files("C:/Users/pasas/Desktop/minecraft/server2026/mods/factions-mc26.3-2.9.6.jar")
}

processResources {
    inputs.property "version", version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand([
            "version": version,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version
        ])
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}