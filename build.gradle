plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
    id 'maven-publish'
}

// Modern Gradle syntax - no more deprecation warnings
base {
    archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
}
version = project.mod_version
group = project.maven_group

repositories {
    // JourneyMap API repositories
    maven {
        name = "JourneyMap (Public)"
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    maven {
        name = "New JourneyMap Maven"
        url = 'https://maven.blamejared.com'
    }
    // Add Modrinth Maven for JourneyMap and Factions
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    // Cloth Config repository
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

configurations.all {
    // Check for snapshots more frequently than Gradle's default of 1 day
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

loom {
    // Disabled split sourcesets - JourneyMap API is client-only and needs to be
    // accessible across the codebase. All code is now in main sourceset.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // JourneyMap API 26.3
    implementation "info.journeymap:journeymap-api-fabric:26.3-2.0.0"

    // Cloth config 26.3
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.3.159"

    // ModMenu for config screen integration
    compileOnly "com.terraformersmc:modmenu:21.0.0"

    // Factions mod 26.3
    compileOnly "maven.modrinth:factions:2.9.6"
}

def modVersion = project.version
def mcVersion = project.minecraft_version
def loaderVersion = project.loader_version

processResources {
    inputs.property "version", modVersion
    inputs.property "minecraft_version", mcVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand([
            "version": modVersion,
            "minecraft_version": mcVersion,
            "loader_version": loaderVersion
        ])
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
